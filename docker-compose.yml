# PostgreSQL para el perfil "postgres". Para el día a día alcanza con el perfil "dev" (H2, sin Docker).
services:
  postgres:
    image: postgres:17
    container_name: gastito-postgres
    environment:
      POSTGRES_DB: gastito
      POSTGRES_USER: ${DB_USER:-gastito}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el .env}
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "5432:5432"
    volumes:
      - gastito-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  gastito-pgdata:
