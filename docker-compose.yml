# PostgreSQL para el perfil "postgres". Para el día a día alcanza con el perfil "dev" (H2, sin Docker).
services:
  postgres:
    image: postgres:17
    container_name: gastito-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gastito}
      POSTGRES_USER: ${POSTGRES_USER:-gastito}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gastito}
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "5432:5432"
    volumes:
      - gastito-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  gastito-pgdata:
