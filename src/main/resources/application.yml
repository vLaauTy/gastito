spring:
  application:
    name: gastito
  profiles:
    default: dev
  # Secretos (TELEGRAM_*, ANTHROPIC_API_KEY) desde el .env de la raíz del proyecto.
  config:
    import: optional:file:.env[.properties]
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  web:
    resources:
      cache:
        # El navegador pregunta en cada carga si cambió el CSS o el JS (si no, un cambio tarda en verse).
        cachecontrol:
          no-cache: true
  jackson:
    # La plata va en el JSON como 380000.00, nunca como 3.8E+5.
    generator:
      write-bigdecimal-as-plain: true

server:
  # 8090 y no 8080, que en esta PC lo usa otro servicio. Se cambia con SERVER_PORT en el .env.
  port: ${SERVER_PORT:8090}
  # Solo esta PC ve el dashboard. Para abrirlo al celular: SERVER_ADDRESS=0.0.0.0 y GASTITO_DASHBOARD_TOKEN en el
  # .env (sin token, la aplicación no arranca escuchando en la red).
  address: ${SERVER_ADDRESS:127.0.0.1}

telegrambots:
  # En false no arranca el long polling (se usa en los tests).
  enabled: true

gastito:
  zona-horaria: America/Argentina/Buenos_Aires
  telegram:
    token: ${TELEGRAM_BOT_TOKEN:}
    username: ${TELEGRAM_BOT_USERNAME:}
    allowed-user-id: ${TELEGRAM_ALLOWED_USER_ID:0}
  bot:
    # Un gasto claro (monto, categoría segura, sin repetidos, juntadas, cuotas ni fijos) se guarda solo y la tarjeta
    # queda con ✏️ Editar y ↩️ Deshacer. En false, todo se confirma con el botón Guardar.
    guardado-automatico: true
    # Un gasto de más que esto se confirma igual, aunque esté claro.
    monto-maximo-automatico: 100000
  ia:
    api-key: ${ANTHROPIC_API_KEY:}
    url: https://api.anthropic.com
    modelo: claude-haiku-5-5
    max-tokens: 1024
    # Tope mensual de gasto en IA, en USD. No bloquea nada: el bot avisa una vez al llegar al 80 % y otra al 100 %.
    # Con 0 se apagan los avisos.
    tope-mensual-usd: 2
    # Precios en USD por millón de tokens (prompts de hasta 100.000 tokens). El costo de cada llamada se calcula al
    # guardarla y queda fijo: si cambian los precios, el historial no se recalcula.
    precios:
      claude-haiku-5-5:
        entrada: 0.10
        salida: 0.50
  dashboard:
    # El link que manda /dashboard: sale del puerto del servidor, no se escribe a mano.
    url: http://localhost:${server.port}
    # Solo desde el .env. Si está, los pedidos que no vienen de esta PC lo tienen que traer.
    token: ${GASTITO_DASHBOARD_TOKEN:}
  audio:
    # Servidor de Whisper compatible con la API de OpenAI (corre en la VM). La clave, solo en el .env.
    url: ${WHISPER_URL:http://localhost:9000}
    api-key: ${WHISPER_API_KEY:}
    modelo: whisper-1
    idioma: es
    timeout: 60s
    duracion-maxima: 60s
  recibos:
    # Tope de la respuesta de la IA al leer un recibo de sueldo. Los archivos quedan en data/recibos/AAAA/MM/.
    max-tokens: 3000
  sueldo:
    # Desde qué diferencia (en %) entre lo calculado y lo cobrado se marca con una alerta.
    tolerancia-cobro-porcentaje: 1
    # Al controlar un recibo: pesos que se perdonan por concepto y puntos que se perdonan en un porcentaje de descuento.
    tolerancia-concepto: 1
    tolerancia-porcentaje: 0.05
    # Un sueldo cobrado hasta este día del mes es del mes anterior (se cobra alrededor del 5); después, del mismo mes.
    dia-limite-periodo-anterior: 15
  ticket:
    # Las fotos quedan en data/tickets/AAAA/MM/<id>.jpg (data/ está en el .gitignore).
    carpeta-datos: data
    # Lado más largo de la foto que se manda a la IA: un ticket se lee igual y cuesta menos tokens.
    lado-maximo: 1568
    tamanio-maximo: 10MB
    # Un ticket largo trae muchos productos: la respuesta necesita más lugar que la de un texto.
    max-tokens: 4096
  resumenes:
    # En la zona de gastito.zona-horaria. El semanal sale el domingo; el mensual, el día 1.
    hora-semanal: "21:00"
    hora-mensual: "09:00"
    # Si cambiás a otro modelo, agregá su precio en gastito.ia.precios (si no, el costo queda en 0).
    modelo-semanal: claude-haiku-5-5
    modelo-mensual: claude-haiku-5-5
    max-tokens: 1024
    # Gastos hormiga: compras por debajo de este monto en estas categorías.
    umbral-hormiga: 3000
    categorias-hormiga:
      - Kiosco
      - Comida afuera / delivery
    # Con menos gastos, o con gastos en menos días distintos, el resumen no lleva consejo ni escenarios de ahorro.
    minimo-semanal:
      gastos: 5
      dias: 3
    minimo-mensual:
      gastos: 15
      dias: 7
  repetidos:
    # Un gasto nuevo se compara con los de esta ventana, antes y después (mismo monto con 1% o $50 de tolerancia).
    ventana: 3h
  cuotas:
    # MISMO_MES: la primera cuota es la del mes de la compra. MES_SIGUIENTE: si la tarjeta cobra al mes siguiente.
    primera-cuota: MISMO_MES
  fijos:
    # Como máximo, cada cuánto se manda el recordatorio agrupado de fijos vencidos sin cargar.
    intervalo-recordatorio: 3d
  consultas:
    modelo: claude-haiku-5-5
    max-tokens: 1024
    # Tope de llamadas a herramientas por pregunta, para acotar el costo.
    max-llamadas: 3

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/gastito;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    username: sa
    password:

---
spring:
  config:
    activate:
      on-profile: postgres
  # Conexión desde el .env (DB_URL, DB_USER, DB_PASSWORD). Sin valores por defecto: si falta alguna,
  # la aplicación no arranca, y la contraseña nunca queda escrita en el repo.
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

---
spring:
  config:
    activate:
      on-profile: prueba
  # La base de prueba, en el mismo PostgreSQL que la real (mismo usuario y contraseña del .env). Todo lo que se
  # carga acá es de prueba: el generador de datos solo corre con este perfil.
  datasource:
    url: ${DB_PRUEBA_URL:jdbc:postgresql://localhost:5432/gastito_prueba}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
gastito:
  ticket:
    # Fotos aparte: los ids de las dos bases se repiten.
    carpeta-datos: data/prueba
